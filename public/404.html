<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <title>La Demi Lune</title>
    <!--
      GitHub Pages ne sait pas router une SPA : toute URL profonde (ex.
      /demi-lune-comptabilite/documents/xxx) tombe ici (404). On encode le chemin
      dans la query puis on redirige vers index.html, qui le restaure.
      pathSegmentsToKeep = 1 : on conserve le segment de base (le nom du dépôt).
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
